<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Birthday Surprise for Saurav</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #19002e, #680078, #ff4081);
    color: white;
    text-align: center;
    overflow-x: hidden;
}

.container {
    padding: 40px 15px;
    margin-top: 10vh;
}

h1 {
    font-size: 35px;
    color: #ffe66d;
    text-shadow: 0 0 15px pink;
}

p {
    font-size: 19px;
}

button {
    background: #ffcc00;
    color: #3d003d;
    border: none;
    padding: 15px 25px;
    border-radius: 30px;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
    margin-top: 20px;
}

button:hover {
    transform: scale(1.08);
}

#surprise {
    display: none;
    animation: appear 1.5s ease;
}

.cake {
    font-size: 90px;
    animation: bounce 1s infinite alternate;
}

.message {
    font-size: 24px;
    color: #fff3a6;
    line-height: 1.6;
}

.balloon {
    position: fixed;
    bottom: -100px;
    font-size: 35px;
    animation: fly 8s linear infinite;
    pointer-events: none;
}

@keyframes fly {
    to {
        transform: translateY(-120vh);
    }
}

@keyframes appear {
    from {opacity: 0; transform: scale(0.5);}
    to {opacity: 1; transform: scale(1);}
}

@keyframes bounce {
    to {transform: translateY(-15px);}
}
</style>
</head>

<body>

<div class="container">

<div id="welcome">
    <h1>Hey Saurav! ❤️</h1>
    <p>I have a special surprise for you!</p>
    <p>Are you ready? 😍</p>
    <button onclick="showSurprise()">Open Your Surprise 🎁</button>
</div>

<div id="surprise">
    <h1>🎉 HAPPY BIRTHDAY SAURAV! 🎉</h1>

    <div class="cake">🎂</div>

    <p class="message">
        Dear Saurav ❤️<br><br>
        May your life be filled with happiness,<br>
        success, love and endless smiles.<br><br>
        Keep shining and keep smiling! ✨<br><br>
        Have an amazing birthday! 🥳
    </p>

    <h2>🎈🎊🎁❤️🎊🎈</h2>
    <p>With lots of love and best wishes!</p>
</div>

</div>

<script>
function showSurprise() {
    document.getElementById("welcome").style.display = "none";
    document.getElementById("surprise").style.display = "block";

    for (let i = 0; i < 25; i++) {
        let balloon = document.createElement("div");
        balloon.className = "balloon";
        balloon.innerHTML = ["🎈","🎉","✨","❤️"][Math.floor(Math.random()*4)];
        balloon.style.left = Math.random() * 100 + "vw";
        balloon.style.animationDelay = Math.random() * 5 + "s";
        document.body.appendChild(balloon);
    }
}
</script>

</body>
</html>
